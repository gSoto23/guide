# Local development services (spec 001 quickstart).
services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: guidesk
      POSTGRES_USER: guidesk
      POSTGRES_PASSWORD: guidesk_local_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidesk -d guidesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  postgres-data:
