packages:
  - apps/*
  - packages/*
  - evals/*
  - e2e

# Supply-chain controls (SEC-12).
# Dependency install scripts are blocked unless listed here as true.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  # Feature 002 (T001): only a funding message (opencollective-postinstall). Not needed.
  tesseract.js: false

# Wait 3 days (in minutes) before installing a newly published version.
minimumReleaseAge: 4320

# Advisories that `pnpm audit` (CI, SEC-12) skips. Each entry needs a reason and an exit condition.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7, ReDoS through single-branch repeated extglobs; no patched version yet.
    # Only production path: apps/portal > next-intl > @parcel/watcher. The watcher runs only in
    # `next dev` (next-intl's message extractor) and compiles next-intl's own fixed ignore globs,
    # never user input. The lint tooling paths are devDependencies, outside `--prod`.
    # Remove this entry once picomatch ships a fix and the lockfile picks it up.
    - GHSA-fc5q-39xc-vjpf
