name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default (SEC-12).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_DB: guidesk
          POSTGRES_USER: guidesk
          POSTGRES_PASSWORD: guidesk_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guidesk -d guidesk"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://guidesk:guidesk_ci_only@localhost:5432/guidesk
    steps:
      # Actions are pinned by commit SHA (SEC-12). Renovate keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known-vulnerability scan of runtime dependencies; fails on high or critical (SEC-12).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      # Lint, typecheck, test, and build run in every workspace package through Turborepo,
      # including apps/sandbox and packages/vault (feature 002, T008).
      - run: pnpm lint
      - run: pnpm typecheck
      # Every generated time zone exists in this Node.js runtime (research R11, T038).
      - run: pnpm --filter @guidesk/domain tz:check
      # Applies migrations to the CI database and fails if a tenant table lacks forced RLS (T015).
      - run: pnpm lint:rls
      - run: pnpm test
      # Integration tests start their own PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: pnpm test:integration
      - run: pnpm build

  # Performance budgets for the portal (spec 001 plan, Performance Budget; T100, T101).
  # Runs against a local production build until preview deployments exist.
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@guidesk/portal
      # Initial JavaScript per route ≤ 150 KB gzip (apps/portal/bundle-budget.json).
      - run: pnpm --filter @guidesk/portal bundle:check
      # LCP ≤ 2.5 s, CLS ≤ 0.1, and total blocking time ≤ 200 ms as the lab proxy for INP
      # (lighthouserc.json). Uses the runner's Chrome.
      - run: pnpm perf:lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  # The extraction eval needs the ANTHROPIC_API_KEY repository secret, which pull requests from
  # forks do not receive. Without it, this job leaves a notice and `evals-extraction` is skipped
  # instead of failing. A skipped job counts as passing for a required check, so the eval gate
  # only holds once the secret exists.
  evals-extraction-secret:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          # Only whether the secret is set, never its value.
          PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" != "true" ]; then
            message="ANTHROPIC_API_KEY is not available to this run (no repository secret, or a pull request from a fork), so the extraction eval was skipped."
            echo "::notice title=Extraction eval skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Listing extraction eval suite (research R6, constitution V). Runs on every pull request and
  # blocks the merge when it fails (make it a required check in the branch protection rules).
  # One run is 35 calls to Claude, about $1–2.
  evals-extraction:
    needs: evals-extraction-secret
    if: needs.evals-extraction-secret.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@guidesk/evals-extraction^...
      - run: pnpm --filter @guidesk/evals-extraction eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extraction-eval-report
          path: evals/extraction/report/
          retention-days: 14
