name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.stage || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the AWS account exists and the repository variable AWS_DEPLOY_ROLE_ARN is set
    # (Settings > Secrets and variables > Actions > Variables); every run failed without it.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Production needs a manual run and the "production" environment approval.
    environment: ${{ github.event.inputs.stage || 'staging' }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC to assume the AWS deploy role; no long-lived keys (ADR-0009)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm sst deploy --stage ${{ github.event.inputs.stage || 'staging' }}
        # Stage settings (infra/config.ts, infra/alerts.ts) come from the GitHub environment's
        # variables (Settings > Environments > staging or production > Variables). Unset variables
        # arrive empty, which the stage config treats as not set. Secrets stay in SST (infra/secrets.ts).
        env:
          GUIDESK_PORTAL_DOMAIN: ${{ vars.GUIDESK_PORTAL_DOMAIN }}
          GUIDESK_API_DOMAIN: ${{ vars.GUIDESK_API_DOMAIN }}
          GUIDESK_GUIDE_DOMAIN: ${{ vars.GUIDESK_GUIDE_DOMAIN }}
          GUIDESK_EMAIL_SENDER: ${{ vars.GUIDESK_EMAIL_SENDER }}
          GUIDESK_ALERT_EMAIL: ${{ vars.GUIDESK_ALERT_EMAIL }}
          GUIDESK_CONTACT_EMAIL: ${{ vars.GUIDESK_CONTACT_EMAIL }}
          GUIDESK_COMPANY_NAME: ${{ vars.GUIDESK_COMPANY_NAME }}
          GUIDESK_SENTRY_DSN: ${{ vars.GUIDESK_SENTRY_DSN }}
          GUIDESK_PLAN_CONTACT_EMAIL: ${{ vars.GUIDESK_PLAN_CONTACT_EMAIL }}
          GUIDESK_CIVITATIS_AFFILIATE_ID: ${{ vars.GUIDESK_CIVITATIS_AFFILIATE_ID }}
          GUIDESK_EXPERIENCE_IMAGE_ORIGINS: ${{ vars.GUIDESK_EXPERIENCE_IMAGE_ORIGINS }}
          GUIDESK_PMS_BEDS24: ${{ vars.GUIDESK_PMS_BEDS24 }}
          GUIDESK_PMS_HOSTEX: ${{ vars.GUIDESK_PMS_HOSTEX }}
          GUIDESK_EXTRACTION_SCREENSHOTS: ${{ vars.GUIDESK_EXTRACTION_SCREENSHOTS }}
          GUIDESK_GUIDE_INTERVIEW_VOICE: ${{ vars.GUIDESK_GUIDE_INTERVIEW_VOICE }}
          GUIDESK_GUIDE_SCANNED_PDF: ${{ vars.GUIDESK_GUIDE_SCANNED_PDF }}
      # Apply pending migrations as a one-off task of the API (same image, role, and network);
      # the stage's API task definition now exists, so this also works on the first deploy.
      - run: scripts/aws-task.sh "$STAGE" migrate
        env:
          STAGE: ${{ github.event.inputs.stage || 'staging' }}
